[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lakshya"
version = "0.1.0"
description = "A human-approved multi-agent job search and application workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.49,<1", "langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4",
  "APScheduler>=3.11,<4", "beautifulsoup4>=4.13,<5", "rapidfuzz>=3.12,<4",
  "feedparser>=6,<7", "playwright>=1.51,<2", "python-docx>=1.1,<2",
  "pypdf>=5,<7", "weasyprint>=65,<70", "reportlab>=4,<5", "openpyxl>=3.1,<4",
  "python-multipart>=0.0.20,<1", "psycopg[binary]>=3.2,<4", "cryptography>=44,<47",

  "alembic>=1.14,<2", "fastapi>=0.115,<1", "httpx>=0.27,<1",
  "pydantic>=2.9,<3", "python-dotenv>=1,<2", "PyYAML>=6,<7",
  "SQLAlchemy>=2.0,<2.1", "structlog>=24.4,<27", "typer>=0.15,<1",
  "uvicorn[standard]>=0.32,<1", "tzdata>=2024.2", "rich>=13,<15"
]

[project.optional-dependencies]
ml = ["sentence-transformers>=3.4,<6"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "mypy>=1.13,<2", "types-PyYAML>=6", "types-openpyxl>=3.1", "types-reportlab>=4"]
postgres = ["psycopg[binary]>=3.2,<4", "cryptography>=44,<47"]

[project.scripts]
lakshya = "lakshya.cli:app"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["lakshya*"]

[tool.setuptools.package-data]
"lakshya.prompts" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["backend/lakshya"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["typer.*", "structlog.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["feedparser.*", "weasyprint.*", "apscheduler.*", "sentence_transformers.*", "numpy.*"]
ignore_missing_imports = true
follow_imports = "skip"
follow_imports_for_stubs = true
